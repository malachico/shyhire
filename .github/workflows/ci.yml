name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, test (Firestore emulator) & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - name: Start Firestore emulator and run tests
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8085 >/tmp/firestore-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8085/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8085/ >/dev/null || (cat /tmp/firestore-emulator.log && exit 1)
          npm test
      - run: npm run build
